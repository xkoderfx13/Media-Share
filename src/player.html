<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" referrer="origin">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
video { width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<video id="v" autoplay muted playsinline></video>
<script>
var p = new URLSearchParams(location.search);
var src = p.get('u');
var end = parseInt(p.get('e')) || 0;
if (src) {
  var v = document.getElementById('v');
  v.src = src;
  v.muted = false;
  if (end > 0) setTimeout(function () { v.pause(); v.src = ''; }, end * 1000);
} else {
  document.body.innerHTML = '<div style="color:#fff;padding:40px;text-align:center;font-family:sans-serif">No video URL</div>';
}
</script>
</body>
</html>
